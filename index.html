<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pro Countdown App</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f172a">

<style>
body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #0f172a;
    color: white;
}

.app {
    max-width: 420px;
    margin: auto;
}

.header {
    padding: 20px;
    font-weight: bold;
    font-size: 20px;
}

.card {
    background: #1e293b;
    margin: 15px;
    padding: 20px;
    border-radius: 20px;
}

.circle {
    width: 120px;
    height: 120px;
    margin: auto;
    position: relative;
}

svg {
    transform: rotate(-90deg);
}

circle {
    fill: none;
    stroke-width: 10;
}

.bg {
    stroke: #334155;
}

.progress {
    stroke: #22c55e;
    stroke-linecap: round;
    stroke-dasharray: 314;
    stroke-dashoffset: 314;
}

.percent-text {
    position: absolute;
    top: 35px;
    width: 100%;
    text-align: center;
    font-weight: bold;
}

.calendar {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 5px;
}

.day {
    padding: 6px 2px;
    border-radius: 8px;
    text-align: center;
    min-height: 58px;
    box-sizing: border-box;
    overflow: hidden;
}

.day strong {
    display: block;
    font-size: 14px;
    line-height: 18px;
}

.day span {
    display: block;
    font-size: 8px;
    line-height: 11px;
    margin-top: 2px;
    opacity: 0.95;
}

.work {
    background: #22c55e;
}

.weekend {
    background: #ef4444;
}

.holiday {
    background: #eab308;
    color: black;
}

.deadline {
    background: #b91c1c !important;
    color: white;
}

.today {
    border: 2px solid white;
    box-shadow: 0 0 10px #38bdf8;
}

.month-title {
    margin-top: 18px;
    margin-bottom: 10px;
    font-weight: bold;
    font-size: 16px;
}

.week-header {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 5px;
    margin-bottom: 5px;
    font-size: 10px;
    text-align: center;
    opacity: 0.8;
}

.legend {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    font-size: 12px;
    margin-top: 15px;
}

.legend div {
    display: flex;
    align-items: center;
    gap: 6px;
}

.box {
    width: 14px;
    height: 14px;
    border-radius: 4px;
}
</style>
</head>

<body>

<div class="app">

    <div class="header">📱 Countdown App</div>

    <div class="card">
        <div class="circle">
            <svg width="120" height="120">
                <circle cx="60" cy="60" r="50" class="bg"></circle>
                <circle cx="60" cy="60" r="50" class="progress" id="progressCircle"></circle>
            </svg>
            <div class="percent-text" id="percentText">0%</div>
        </div>

        <h2 style="text-align:center" id="daysLeft">0</h2>
        <div style="text-align:center">Hari bekerja lagi</div>

        <div class="legend">
            <div><span class="box" style="background:#22c55e;"></span> Hari kerja</div>
            <div><span class="box" style="background:#ef4444;"></span> Jumaat/Sabtu</div>
            <div><span class="box" style="background:#eab308;"></span> Cuti umum</div>
            <div><span class="box" style="background:#b91c1c;"></span> Deadline</div>
        </div>
    </div>

    <div class="card">
        <div id="calendar"></div>
    </div>

</div>

<script>
const startDate = new Date(2026, 3, 15);
const endDate = new Date(2026, 6, 28);

const holidays = [
    "2026-05-01",
    "2026-05-02",
    "2026-05-27",
    "2026-05-28",
    "2026-06-01",
    "2026-06-17"
];

const dayNames = [
    "Ahad",
    "Isnin",
    "Selasa",
    "Rabu",
    "Khamis",
    "Jumaat",
    "Sabtu"
];

const shortDayNames = [
    "Ahd",
    "Isn",
    "Sel",
    "Rab",
    "Kha",
    "Jum",
    "Sab"
];

function format(d) {
    let year = d.getFullYear();
    let month = String(d.getMonth() + 1).padStart(2, "0");
    let day = String(d.getDate()).padStart(2, "0");
    return `${year}-${month}-${day}`;
}

function isWorkingDay(d) {
    let day = d.getDay();
    let str = format(d);

    return !(day === 5 || day === 6 || holidays.includes(str));
}

function totalDays() {
    let count = 0;
    let d = new Date(startDate);

    while (d <= endDate) {
        if (isWorkingDay(d)) count++;
        d.setDate(d.getDate() + 1);
    }

    return count;
}

function remainingDays() {
    let count = 0;
    let d = new Date();

    d.setHours(0, 0, 0, 0);

    while (d <= endDate) {
        if (isWorkingDay(d)) count++;
        d.setDate(d.getDate() + 1);
    }

    return count;
}

const total = totalDays();

function update() {
    let remain = remainingDays();
    let percent = ((total - remain) / total) * 100;

    if (percent < 0) percent = 0;
    if (percent > 100) percent = 100;

    document.getElementById("daysLeft").innerText = remain;
    document.getElementById("percentText").innerText = percent.toFixed(1) + "%";

    let offset = 314 - (314 * percent / 100);
    document.getElementById("progressCircle").style.strokeDashoffset = offset;
}

setInterval(update, 1000);
update();

function generateCalendar() {
    let cal = document.getElementById("calendar");
    cal.innerHTML = "";

    let current = new Date(startDate);
    let today = format(new Date());

    let deadline = [];
    let temp = new Date(endDate);

    while (deadline.length < 7) {
        if (isWorkingDay(temp)) {
            deadline.push(format(temp));
        }
        temp.setDate(temp.getDate() - 1);
    }

    let scrollTarget = null;

    while (current <= endDate) {
        let month = current.getMonth();
        let year = current.getFullYear();

        let first = new Date(year, month, 1);
        let last = new Date(year, month + 1, 0);

        let monthDiv = document.createElement("div");

        let title = document.createElement("div");
        title.className = "month-title";
        title.innerText = first.toLocaleString("ms-MY", {
            month: "long",
            year: "numeric"
        });

        monthDiv.appendChild(title);

        let weekHeader = document.createElement("div");
        weekHeader.className = "week-header";

        shortDayNames.forEach(name => {
            let div = document.createElement("div");
            div.innerText = name;
            weekHeader.appendChild(div);
        });

        monthDiv.appendChild(weekHeader);

        let grid = document.createElement("div");
        grid.className = "calendar";

        for (let i = 0; i < first.getDay(); i++) {
            grid.appendChild(document.createElement("div"));
        }

        for (let d = 1; d <= last.getDate(); d++) {
            let date = new Date(year, month, d);
            let str = format(date);
            let day = date.getDay();

            let div = document.createElement("div");
            div.className = "day";

            if (deadline.includes(str)) {
                div.classList.add("deadline");
            } else if (holidays.includes(str)) {
                div.classList.add("holiday");
            } else if (day === 5 || day === 6) {
                div.classList.add("weekend");
            } else {
                div.classList.add("work");
            }

            if (str === today) {
                div.classList.add("today");
                scrollTarget = monthDiv;
            }

            div.innerHTML = `
                <strong>${d}</strong>
                <span>Hari ${dayNames[day]}</span>
            `;

            grid.appendChild(div);
        }

        monthDiv.appendChild(grid);
        cal.appendChild(monthDiv);

        current = new Date(year, month + 1, 1);
    }

    if (scrollTarget) {
        setTimeout(() => {
            scrollTarget.scrollIntoView({
                behavior: "smooth",
                block: "start"
            });
        }, 300);
    }
}

generateCalendar();

if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js");
}
</script>

</body>
</html>
